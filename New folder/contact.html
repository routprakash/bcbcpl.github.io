<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - BuildPro Constructions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .page-header {
      background: url('https://source.unsplash.com/1600x400/?contact,construction') no-repeat center center/cover;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.6);
    }

    .page-header h1 {
      font-size: 3rem;
      font-weight: bold;
    }

    .contact-section {
      padding: 60px 0;
    }

    .contact-section h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
    }

    .contact-info {
      font-size: 1rem;
      line-height: 1.6;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #007bff;
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <!-- Page Header -->
  <div class="page-header">
    <div class="container text-center">
      <h1>Contact Us</h1>
    </div>
  </div>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="container">
      <h2>We'd love to hear from you</h2>
      <div class="row mt-4">
        <div class="col-md-6">
          <div class="contact-info">
            <h5>Head Office</h5>
            <p>BuildPro Constructions Pvt. Ltd.<br>
              1234 Industrial Zone,<br>
              Business Park Avenue,<br>
              Metro City, 560001<br>
              Phone: +91 98765 43210<br>
              Email: info@buildpro.com</p>

            <h5>Follow Us</h5>
            <p>
              <a href="#">LinkedIn</a> | <a href="#">Facebook</a> | <a href="#">Twitter</a>
            </p>
          </div>
        </div>
        <div class="col-md-6">
          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Your Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
